    uses: telekom-mms/.github/.github/workflows/release.yml@92385a5d2bb717a33641f20476b5d0ca6a0ab524 # main
    secrets:
      GH_BRANCH_PROTECTION_APP_TOKEN: ${{ secrets.GH_BRANCH_PROTECTION_APP_TOKEN }}
